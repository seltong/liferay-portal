import com.liferay.gradle.plugins.patcher.PatchTask
import com.liferay.gradle.util.FileUtil
import com.liferay.gradle.util.OSDetector

apply plugin: "com.liferay.patcher"
apply plugin: "nebula.optional-base"

task compileJavaMvn(type: Exec)
task downloadSrc(type: Copy)
task jarMvn(type: Exec)
task patch(type: PatchTask)

sourceCompatibility = "1.6"
targetCompatibility = "1.6"

String jasperreportsSrcUrl = "https://repo1.maven.org/maven2/net/sf/jasperreports/jasperreports/6.20.0/jasperreports-6.20.0.jar"
File srcDir = new File(buildDir, "jasperreports")

compileJavaMvn {
	commandLine _getMvnCommand("compile")
	dependsOn downloadSrc
	workingDir = srcDir
}

downloadSrc {
	doLast {
		File pomXmlFile = new File(srcDir, "pom.xml")

		if (pomXmlFile.exists()) {
			pomXmlFile.text = pomXmlFile.text.replace(
				"<groupId>com.lowagie</groupId>\n" +
				"\t\t\t<artifactId>itext</artifactId>\n" +
				"\t\t\t<version>2.1.7.js7</version>",
				"<groupId>com.github.librepdf</groupId>\n" +
				"\t\t\t<artifactId>openpdf</artifactId>\n" +
				"\t\t\t<version>1.3.11</version>")
		} else {
			System.out.println("\n\nPom not exists!\n\n")
		}
	}

	from {
		zipTree(FileUtil.get(project, jasperreportsSrcUrl))
	}

	into buildDir
}

jar {
	setActions([])

	dependsOn jarMvn
}

jarMvn {
	commandLine _getMvnCommand("package")
	dependsOn compileJavaMvn

	doLast {
		copy {
			from new File(srcDir, "target")
			include "jasperreports-6.20.0.jar"
			into distsDir

			rename {
				jar.archiveName
			}
		}
	}

	workingDir = srcDir
}

private List<String> _getMvnCommand(String command) {
	if (OSDetector.windows) {
		return ["cmd.exe", "/c", "mvn ${command}"]
	}

	return ["/bin/sh", "-c", "mvn ${command}"]
}

dependencies {
	compile group: "com.lowagie", name: "itext", optional, version: "2.1.7.js10"
	compile group: "net.sf.jasperreports", name: "jasperreports", version: "6.20.0"
}

patch {
	ext {
		autoClean = false
	}

//	fileNames "**/demo/samples/paragraphs/build.xml"
//	fileNames "**/demo/samples/webapp-repo/ivy-lib.xml"
//	fileNames "**/demo/samples/webapp/ivy-lib.xml"
	fileNames "**/ivy.xml"
	fileNames "**/pom.xml"
//	fileNames "net/sf/jasperreports/data/bean/BeanDataAdapter.java"

	originalLibModuleName = "jasperreports"
}

repositories {
	maven {
		url "https://jaspersoft.jfrog.io/jaspersoft/third-party-ce-artifacts"

	}
}